name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tasktrack_ass2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore QE190064_PRN232_Ass1_BE.sln
      - run: dotnet build QE190064_PRN232_Ass1_BE.sln --configuration Release --no-restore
      - name: Test API against isolated PostgreSQL
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=tasktrack_ass2;Username=postgres;Password=postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tasktrack_ass2
          API_BASE_URL: http://127.0.0.1:5102/api
          ASPNETCORE_ENVIRONMENT: Production
          ADMIN_EMAIL: admin@ci.example.com
          STAFF_EMAIL: staff@ci.example.com
        shell: bash
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_PASSWORD="$(openssl rand -hex 16)"
          export STAFF_PASSWORD="$(openssl rand -hex 16)"
          api_dll=TaskTrack.API/bin/Release/net8.0/TaskTrack.API.dll
          dotnet "$api_dll" --init-db
          dotnet "$api_dll" --seed-admin
          dotnet "$api_dll" --seed-admin
          dotnet "$api_dll" --urls http://127.0.0.1:5102 > api-test.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail "$API_BASE_URL/departments" > /dev/null; then break; fi
            sleep 1
          done
          dotnet test tests/TaskTrack.IntegrationTests.csproj --configuration Release --no-build --no-restore
